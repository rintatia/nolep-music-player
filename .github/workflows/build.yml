name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rilis NPlayer V7.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk NPlayer-7.1.apk
          gh release create v7.1 NPlayer-7.1.apk --title "NPlayer V7.1" --notes "Rilis NPlayer V7.1. Arsip versi V7 tetap dipertahankan." 
