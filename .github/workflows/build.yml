name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rilis APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "NPlayer-${{ github.run_number }}.apk"
          gh release create "v${{ github.run_number }}" "NPlayer-${{ github.run_number }}.apk" \
            \
            --title "NPlayer build ${{ github.run_number }}" --notes "APK siap pasang. Unduh file .apk di bawah, lalu buka di HP." --latest
