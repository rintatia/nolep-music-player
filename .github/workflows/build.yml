name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rilis NPlayer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(tr -d '[:space:]' < version.txt)
          cp app/build/outputs/apk/release/app-release.apk "NPlayer-V${VER}.apk"
          if gh release view "v${VER}" >/dev/null 2>&1; then
            gh release upload "v${VER}" "NPlayer-V${VER}.apk" --clobber
          else
            gh release create "v${VER}" "NPlayer-V${VER}.apk" --title "NPlayer V${VER}" \
              --notes "NPlayer V${VER}. Unduh file .apk di bawah, lalu pasang di atas versi sebelumnya." --latest
          fi
