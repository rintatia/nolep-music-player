<style>
/* VOICE: aplikasi musik pribadi yang lembut, ilustratif, terasa mahal
   IDEA: sampul album ilustrasi (gaya Chillhop) yang hidup, dibingkai kaca buram
   PICTURE: kanvas animasi tema memenuhi kartu pemutar, memudar ke warna tema di bawah
   COLOUR and TYPE: dari tema terpilih; panel kaca semi-transparan di atas cahaya aksen
   LAYOUT: pemutar satu layar penuh; pustaka ala beranda (sapaan, cari, kartu pilihan, chip, daftar kartu) */
:root{--bg:#0f1020;--card:#1a1b33;--ink:#ecebff;--acc:#ff5c8a;--on:#fff;--font:'Plus Jakarta Sans';
 --mut:color-mix(in srgb,var(--ink) 60%,transparent);--line:color-mix(in srgb,var(--ink) 13%,transparent);--soft:color-mix(in srgb,var(--ink) 7%,transparent);
 --glass:color-mix(in srgb,var(--card) 58%,transparent);--blur:blur(18px) saturate(1.5)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
[hidden]{display:none!important}
html.lock,html.lock body{overflow:hidden;height:100%;overscroll-behavior:none}html.lock .app{padding-bottom:0}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font),system-ui,sans-serif;overflow-x:clip;transition:background-color .4s,color .4s}
.bgfx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bgfx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.bgfx i:first-child{width:70vw;height:70vw;max-width:460px;max-height:460px;left:-20vw;top:-10vh;background:var(--acc)}
.bgfx i:last-child{width:60vw;height:60vw;max-width:400px;max-height:400px;right:-18vw;bottom:8vh;background:color-mix(in srgb,var(--acc) 40%,var(--ink));opacity:.28}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:12px}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:10px 12px 110px}
.view{display:none}.view.on{display:block;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line)}
.gb{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);color:var(--ink);cursor:pointer}
.gb svg{width:22px;height:22px;fill:currentColor}

/* ---------- CLOUD (Claude artifact: assets + db) ---------- */
let cdb=null,assets=null,uid=null,cloudReady=false,uploading={};
async function initCloud(){
 if(NATIVE){nativeCloud();return}
 const st=$('#cloudState');st.textContent='Menghubungkan ke cloud…';
 const timer=setTimeout(()=>{if(!cloudReady)st.textContent='Cloud belum bisa dihubungi. Lagu di HP tetap bisa diputar.'},10000);
 try{
  const C=window.claude;if(!C||!C.use){st.textContent='Cloud hanya aktif saat dibuka dari claude.ai.';clearTimeout(timer);return}
  const [user,db,as]=await Promise.all([C.use('user'),C.use('db'),C.use('assets')]);
  uid=user?await user.id():null;cdb=db;assets=as;
  if(!uid||!cdb){st.textContent='Masuk ke akun Claude untuk memakai cloud.';clearTimeout(timer);return}
  const base=cdb.doc('data/users/'+uid+'/lib');
  base.collection('tracks').orderBy('added','desc').onSnapshot(snap=>{
   cloudReady=true;clearTimeout(timer);
   cloud=snap.docs.map(d=>{const x=d.data()||{};return{id:'c'+d.id,docId:d.id,title:String(x.title||'Tanpa judul'),artist:String(x.artist||''),assetId:String(x.assetId||''),size:+x.size||0,dur:+x.dur||0,added:+x.added||0}}).filter(t=>t.assetId);
   st.textContent=assets?`${cloud.length} lagu di cloud. Bisa diputar dari HP, tablet, atau laptop yang masuk ke akunmu.`:`${cloud.length} lagu di cloud. Unggah hanya bisa dari akun pemilik.`;
   renderLists()},err=>{clearTimeout(timer);st.textContent='Cloud tidak tersedia ('+esc(err&&err.code)+').'});
  cdb.doc('data/users/'+uid+'/settings').get().then(s=>{if(s.exists){const x=s.data();if(x.look&&typeof x.look==='object'&&x.look.bg&&!String(x.look.bg).startsWith('u:')){look=Object.assign(look,x.look);ls.set('look',look);applyTheme();renderThemes()}}}).catch(()=>{});
 }catch(e){clearTimeout(timer);st.textContent='Cloud tidak tersedia di tampilan ini.'}
}

 if(cloud.some(c=>c.title===t.title&&c.size===t.size)){toast('Lagu ini sudah ada di cloud');return}

 try{const r=await assets.upload(t.blob);
  await cdb.doc('data/users/'+uid+'/lib').collection('tracks').doc(r.id).set({title:t.title,artist:t.artist,assetId:r.id,size:t.size,dur:t.dur||0,added:Date.now()});
  toast('Terunggah: '+t.title)}

 openSheet(`<p>Animasi belum membaca lagu</p><div class="help">Izin <b>"rekam audio"</b> untuk NPlayer belum aktif, jadi animasi memakai irama tiruan. Izin ini hanya dipakai untuk membaca suara lagu yang sedang diputar. Mikrofon tidak dipakai dan tidak ada yang direkam.</div><div class="row2"><button class="hbtn g" data-v="set">Buka pengaturan</button><button class="hbtn" data-v="ask">Izinkan</button></div>`,e=>{const b=e.target.closest('[data-v]');if(!b)return;closeSheet();try{b.dataset.v==='ask'?NATIVE.requestViz():NATIVE.openAppSettings()}catch(er){}})}

/* kanvas */
const cv=$('#viz'),gx=cv.getContext('2d');let VW=0,VH=0,vs={},PV={},vErr=0;
function updPV(){PV=palOf(cur())}
function palOf(c,tt){const t=tt||TT(),dark=t[1]==='d',ah=hueOf(t[5]);return{bg:t[2],card:t[3],ink:t[4],acc:t[5],acc2:hsl2hex((ah+150)%360,.8,dark?.65:.45),dark,font:`'${t[6]}',sans-serif`,h:c?hash(c.title+c.artist)%360:ah,ch:c?(c.title[0]||'?').toUpperCase():'♪',title:c?c.title:'NPlayer',artist:c?c.artist:''}}
function resetViz(){vs={};vErr=0;if(VW){gx.fillStyle=TT()[2];gx.fillRect(0,0,VW,VH)}}
function onTheme(){updPV();resetViz();$('#vizTag').textContent=lookName();$('#pfInfo').textContent='NPlayer · '+(HN[look.anim]||'');$('#temaNow').textContent=lookName()}
function sizeViz(){const r=cv.getBoundingClientRect(),d=DPR();if(!r.width)return;VW=r.width;VH=r.height;cv.width=Math.round(VW*d);cv.height=Math.round(VH*d);gx.setTransform(d,0,0,d,0,0);resetViz()}
new ResizeObserver(sizeViz).observe(cv);
let lastF=performance.now();
const vPutar=$('#v-putar');let hzEst=60,lastRaw=0,fSkip=0;
function frame(now){requestAnimationFrame(frame);const raw=now-lastRaw;lastRaw=now;if(raw>4&&raw<40)hzEst+=(1000/raw-hzEst)*.05;
 if(!VW||document.hidden||!vPutar.classList.contains('on')){lastF=now;return}
 const kS=Math.max(1,Math.round(hzEst/(eco?45:90)));fSkip=(fSkip+1)%kS;if(fSkip)return;const dt=Math.min(.05,Math.max(0,(now-lastF)/1000));lastF=now;
 analyse(dt);animT+=dt;
 try{drawScene(gx,VW,VH,animT,AU,PV,vs,look)}catch(e){if(!vErr++)console.error(e)}
 gx.globalAlpha=1;gx.globalCompositeOperation='source-over';drawWave();const pb=$('#bPlay');pb.style.setProperty('--kick',AU.on?AU.kick.toFixed(3):0);$('#ringP').style.strokeDashoffset=(226.2*(1-AU.prog)).toFixed(1)}
const wvc=$('#wv'),wg=wvc.getContext('2d');let WW=0,WH=0;
function sizeWv(){const r=wvc.getBoundingClientRect(),d=DPR();if(!r.width)return;WW=r.width;WH=r.height;wvc.width=Math.round(WW*d);wvc.height=Math.round(WH*d);wg.setTransform(d,0,0,d,0,0)}
new ResizeObserver(sizeWv).observe(wvc);
function syncEco(){document.documentElement.classList.toggle('eco',eco);const b=$('#ecoSw');if(b){b.classList.toggle('on',eco);$('#ecoTxt').textContent=eco?'Nyala: animasi ±45 fps, tanpa efek kaca buram':'Mati: animasi paling halus, lebih boros'}}
setTimeout(()=>{syncEco();$('#ecoSw').onclick=()=>{eco=!eco;ls.set('eco',eco);syncEco();sizeViz();sizeWv();toast(eco?'Mode hemat baterai nyala':'Mode hemat baterai mati')}},0);
const wvS=[];
function drawWave(){if(!WW)return;const c=cur(),seed=c?hash(c.title+c.artist)%997:7,n=Math.max(20,Math.floor(WW/5)),bw=WW/n,p=seeking?+$('#seek').value/1000:AU.prog;wg.clearRect(0,0,WW,WH);
 for(let i=0;i<n;i++){const u=i/n,base=.25+.55*Math.abs(Math.sin(i*.45+seed)*Math.sin(i*.13+seed*.7))+.2*hs(seed+i),sp=AU.f(2+Math.abs((i/(n-1))*2-1)*48),
  tgt=AU.on?Math.min(1,.1+base*.18+Math.pow(sp,2.4)*.8+AU.kick*.16):base*.6,prev=wvS[i]??tgt;wvS[i]=prev+(tgt-prev)*(tgt>prev?.6:.16);const hh=Math.max(3,WH*Math.min(1,wvS[i]));
  wg.fillStyle=u<=p?PV.acc:rgba(PV.ink,.3);const x=i*bw+bw*.2,w=Math.max(1.5,bw*.55);wg.beginPath();if(wg.roundRect)wg.roundRect(x,(WH-hh)/2,w,hh,w/2);else wg.rect(x,(WH-hh)/2,w,hh);wg.fill()}}
requestAnimationFrame(frame);


/* ---------- MODE APK (NATIVE) ---------- */
const jobs={};
function renderJobs(){const el=$('#jobs');if(!el)return;const ks=Object.keys(jobs);el.hidden=!ks.length;
 el.innerHTML=ks.map(k=>{const j=jobs[k];return`<div class="job">${esc(j.label)}${j.pct>=0?' · '+j.pct+'%':''}<div class="bar${j.pct<0?' ind':''}"><i style="width:${Math.max(0,j.pct)}%"></i></div></div>`}).join('')}
function openSheet(html,onClick){$('#actSheet').innerHTML=html;$('#act').classList.add('on');$('#act').onclick=e=>{if(e.target===$('#act')){closeSheet();return}if(onClick)onClick(e)}}
function closeSheet(){$('#act').classList.remove('on')}
async function rescan(){if(!NATIVE)return;if(!NATIVE.hasPermission()){NATIVE.requestPermission();return}await loadLocal();renderLists();toast(local.length+' lagu ditemukan')}
function openAddMenu(){openSheet(`<p>Tambah lagu</p><button class="opt" data-o="scan">${svg(IC.music)}Pindai ulang lagu di HP</button><button class="opt" data-o="link">${svg('<path d="M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10z"/>')}Tambah dari link</button><button class="opt" data-o="upl">${svg('<path d="M5 20h14v-2H5v2zm0-10h4v6h6v-6h4l-7-7-7 7z"/>')}Upload dari HP ke Cloudflare</button><button class="opt" data-o="cloud">${svg(IC.cloud)}Pindai ulang lagu dari Cloudflare</button><button class="opt" data-o="cfg">${svg('<path d="M19.14 12.94a7.4 7.4 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7 7 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54a7 7 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.66 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.38.3.61.22l2.39-.96c.5.38 1.05.7 1.63.94l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54a7 7 0 0 0 1.63-.94l2.39.96c.23.08.49 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>')}Pengaturan Cloud</button><button class="btn ghost" data-o="x" style="width:100%;margin-top:8px">Tutup</button>`,e=>{const o=e.target.closest('[data-o]');if(!o)return;closeSheet();const k=o.dataset.o;if(k==='scan')rescan();else if(k==='link')openLink('');else if(k==='cloud'){go('pustaka');setLib('cloud');nativeCloud()}else if(k==='cfg')openSettings();else if(k==='upl')openUpload()})}
const upQ=[];let upBusy=false;
function nextUp(){if(upBusy||!upQ.length)return;const it=upQ.shift();upBusy=true;jobs['up:'+it.name]={label:'Mengunggah '+it.name+(upQ.length?' · sisa '+upQ.length:''),pct:0};renderJobs();NATIVE.upload(it.kind||'uri',it.ref||it.uri,it.name)}
const cleanName=n=>String(n||'').replace(/[\\/:*?"<>|\n\r\t]/g,'_').trim().slice(0,140)||'lagu';
function upSelected(ids){if(!NATIVE.cloudReady()){toast('Isi token Cloud dulu');openSettings();return}
 const tr=ids.map(byId).filter(t=>t&&(t.kind==='media'||t.kind==='file'));let skip=0;
 for(const t of tr){if(inCloudOf(t)){skip++;continue}upQ.push({kind:t.kind,ref:t.ref,name:cleanName(nameOf(t)||t.title+'.mp3')})}
 const n=tr.length-skip;exitSel();if(!n){toast('Semua lagu itu sudah ada di Cloud');return}toast(n+' lagu diunggah berurutan'+(skip?` (${skip} sudah ada di Cloud)`:''));renderJobs();nextUp()}
function openUpload(){if(!NATIVE.cloudReady()){toast('Isi token Cloud dulu');openSettings();return}
 openSheet(`<p>Upload dari HP ke Cloudflare</p><button class="opt" data-o="list">${svg('<path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-9 14-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>')}<span>Centang banyak dari daftar lagu<br><small style="color:var(--mut);font-weight:500">Semua lagu hasil pindai, bisa Pilih semua</small></span></button><button class="opt" data-o="fm">${svg('<path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/>')}<span>Pilih dari file manager<br><small style="color:var(--mut);font-weight:500">Tekan lama satu file untuk memilih banyak</small></span></button><button class="btn ghost" data-o="x" style="width:100%;margin-top:8px">Tutup</button>`,e=>{const o=e.target.closest('[data-o]');if(!o)return;closeSheet();
  if(o.dataset.o==='list'){go('pustaka');$('#q').value='';setLib('lokal');selMode=true;sel.clear();renderLists();toast('Centang lagunya, lalu tekan Ke Cloud')}else if(o.dataset.o==='fm')NATIVE.pickAudio()})}
function openLink(pre){
 openSheet(`<p>Tambah dari link</p><label class="fld"><span>Link file audio</span><input id="lkUrl" type="url" inputmode="url" placeholder="https://…/lagu.mp3" value="${esc(pre||'')}"></label>
 <div class="help">File akan diunduh dari link lalu langsung disimpan ke Cloudflare. Bisa: link MP3/M4A/FLAC langsung, Google Drive (file dibagikan "siapa saja yang punya link"), Dropbox, Internet Archive, Bandcamp yang sudah dibeli. Tidak bisa: YouTube / YouTube Music.<br>Tips: dari browser, tekan Bagikan lalu pilih NPlayer.</div>
 <div class="row2"><button class="btn" data-o="go">Simpan</button><button class="btn ghost" data-o="x">Batal</button></div>`,e=>{const o=e.target.closest('[data-o]');if(!o)return;if(o.dataset.o==='x'){closeSheet();return}
  const url=$('#lkUrl').value.trim();if(!/^https?:\/\/\S+$/i.test(url)){toast('Tempel link yang diawali https://');return}
  if(/(^|\.)(youtube\.com|youtu\.be|music\.youtube\.com)/i.test(url.replace(/^https?:\/\//,'').split('/')[0])){toast('Link YouTube tidak didukung');return}
  if(!NATIVE.cloudReady()){toast('Atur token Cloud terlebih dahulu melalui menu unggah lagu.');return}
  const id='dl'+Date.now();jobs[id]={label:'Menyiapkan unduhan…',pct:-1};NATIVE.download(url,id,true);closeSheet();go('pustaka');setLib('cloud');renderJobs()});
 setTimeout(()=>{const i=$('#lkUrl');if(i&&!pre)i.focus()},250)}
function openSettings(){let c={};try{c=JSON.parse(NATIVE.getConfig())}catch(e){}
 openSheet(`<p>Pengaturan NPlayer Cloud</p>
 <div class="help">Token akses cloud disimpan terenkripsi menggunakan Android Keystore pada perangkat ini.</div>
 <label>Token Cloud</label><input id="cfToken" type="password" autocomplete="off" placeholder="${c.hasToken?'Token sudah tersimpan — isi hanya jika ingin mengganti':'Tempel token akses Cloud'}">
 <label class="chk"><input type="checkbox" id="cfAuto" ${c.auto!==false?'checked':''}>Unggah otomatis lagu hasil unduhan</label>
 <div id="cfMsg" class="help">${c.hasToken?'Token sudah tersimpan di perangkat.':'Token diperlukan untuk mengakses NPlayer Cloud.'}</div>
 <div class="row2"><button class="btn" data-o="save">Simpan &amp; tes</button><button class="btn ghost" data-o="x">Tutup</button></div>`,e=>{const o=e.target.closest("[data-o]");if(!o)return;if(o.dataset.o==="x"){closeSheet();return}
  NATIVE.setConfig(JSON.stringify({auto:$("#cfAuto").checked,token:$("#cfToken").value}));$("#cfToken").value="";$("#cfMsg").textContent="Menguji layanan…";NATIVE.testCloud()})}
function nativeCloud(){const st=$('#cloudState');if(!NATIVE.cloudReady()){st.textContent='Token Cloud belum diatur. Tekan + lalu Pengaturan Cloud.';cloud=[];renderLists();return}st.textContent='Memuat lagu dari Cloudflare…';NATIVE.listCloud()}
window.onNative=(type,d)=>{try{
 if(type==='perm'){loadLocal().then(()=>{renderLists();toast(d.granted?local.length+' lagu ditemukan':'Izin ditolak. Bisa diubah di Pengaturan HP.')})}
 else if(type==='dl'){if(d.status==='progress'){jobs[d.id]={label:'Mengunduh '+(d.name||''),pct:d.pct};renderJobs()}
  else if(d.status==='uploading'){delete jobs[d.id];jobs['up:'+d.name]={label:'Menyimpan ke Cloudflare: '+d.name,pct:0};renderJobs()}
  else{delete jobs[d.id];renderJobs();if(d.status==='done'){toast('Tersimpan di Cloudflare: '+d.name);NATIVE.listCloud()}else toast('Gagal: '+d.msg)}}
 else if(type==='picked'){const its=(d.items||[]).filter(x=>x.uri);if(!its.length){if(d.msg)toast(d.msg);return}its.forEach(x=>upQ.push({kind:'uri',ref:x.uri,name:x.name.replace(/[\\/:*?"<>|\n\r\t]/g,'_').trim().slice(0,140)||'lagu'}));toast(its.length+' lagu akan diunggah');go('pustaka');setLib('cloud');nextUp()}
 else if(type==='up'){const k='up:'+d.name;if(d.status!=='progress'){upBusy=false;setTimeout(nextUp,50)}if(d.status==='progress'){jobs[k]={label:'Mengunggah '+d.name,pct:d.pct};renderJobs()}
  else{delete jobs[k];renderJobs();if(d.status==='done'){toast('Tersimpan di Cloudflare');NATIVE.listCloud()}else toast('Gagal unggah: '+d.msg)}}
 else if(type==='cloud'){const st=$('#cloudState');if(d.ok){cloud=d.items.map(i=>{const p=parseName(i.key.split('/').pop());return{id:'c'+i.key,key:i.key,kind:'r2',title:p.title,artist:p.artist,size:+i.size||0,added:+i.added||0,dur:0,src:'/r2/'+encodeURIComponent(i.key)}}).sort((a,b)=>b.added-a.added);st.textContent=cloud.length+' lagu di Cloudflare R2.'}else st.textContent=d.msg;renderLists()}
 else if(type==='test'){const m=$('#cfMsg');if(m)m.textContent=d.msg;toast(d.ok?'Cloudflare tersambung':'Gagal: '+d.msg);if(d.ok)nativeCloud()}
 else if(type==='del'){toast(d.ok?'Dihapus dari Cloudflare':'Gagal: '+d.msg);NATIVE.listCloud()}
 else if(type==='np'){if(!npOn)return;if(d.state==='playing'){np.playing=true;if(d.dur>0)np.dur=d.dur/1000;onPlayState()}else if(d.state==='ended'){np.playing=false;next(true)}else if(d.state==='error'){npOn=false;np.playing=false;onPlayState();toast(d.msg||'Format tidak didukung');setTimeout(()=>next(false),900)}}
 else if(type==='bg'){if(!ENG)goBg()}
 else if(type==='fg'){if(ENG)engPoll();else goFg()}
 else if(type==='eng'){if(ENG)engPoll()}
 else if(type==='bgs_wait'){toast('Menyimpan '+(d.n|0)+' foto latar…')}
 else if(type==='bgs'){loadBgs();const n=d.added|0;if(n){const last=myBgs[0];if(last){look.bg='u:'+last;if(!look.palManual)look.pal='auto';saveLook();resetViz();applyTheme()}toast(n+' latar ditambahkan'+(d.failed?', '+d.failed+' gagal':''))}else toast(d.msg||'Tidak ada foto dipilih');if($('#v-tema').classList.contains('on'))renderThemes()}
 else if(type==='viz'){toast(d.granted?'Animasi sekarang membaca beat lagu':'Izin ditolak, animasi memakai irama tiruan')}
 else if(type==='share'){if(NATIVE)NATIVE.takeShare();openLink(d.url)}
}catch(e){console.error(e)}};
window.nolepBack=()=>{if(selMode){exitSel();return true}if(openPl&&libTab==='playlist'&&$('#v-pustaka').classList.contains('on')&&!$('#act').classList.contains('on')){openPl=null;renderLists();return true}if($('#act').classList.contains('on')){closeSheet();return true}if($('#modal').classList.contains('on')){$('#mNo').click();return true}if(!$('#v-putar').classList.contains('on')){go('putar');return true}return false};
if(NATIVE){const pk=document.querySelector('.hello .pick');if(pk){const inp=pk.querySelector('input');if(inp)inp.remove();pk.setAttribute('role','button');pk.setAttribute('aria-label','Tambah lagu');pk.onclick=openAddMenu}}

/* ---------- MULAI ---------- */
loadBgs();applyTheme();syncModes();syncPlay();
const startHash=location.hash.slice(1);go(startHash||'putar');
openDB().then(async d=>{idb=d;await loadLocal();renderLists();if(!local.length&&!startHash)go('pustaka');if(NATIVE){const s=NATIVE.takeShare();if(s)openLink(s)}});
renderLists();initCloud();
}
</script>
